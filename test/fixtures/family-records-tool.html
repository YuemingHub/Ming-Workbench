<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>家庭记录</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; line-height: 1.6; }
    h1 { font-size: 1.4rem; }
    form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    input, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 8px; }
    textarea { min-height: 60px; resize: vertical; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: 0; border-radius: 6px; }
    button:hover { background: #1d4ed8; }
    .record { border: 1px solid #8884; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
    .record h3 { margin: 0 0 4px; font-size: 1rem; }
    .record time { color: #888; font-size: 0.8rem; }
    .record p { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
    .record button { width: auto; background: #b91c1c; padding: 2px 10px; font-size: 0.8rem; }
    .empty { color: #888; }
  </style>
</head>
<body>
  <h1>家庭记录</h1>
  <p class="empty" id="hint">随手记一笔家里的事，关掉再开记录还在。</p>
  <form id="form">
    <input id="title" name="title" placeholder="标题，比如：孩子今天说了啥" maxlength="60" required />
    <textarea id="note" name="note" placeholder="内容"></textarea>
    <button type="submit">添加</button>
  </form>
  <div id="list"></div>

  <script>
    const KEY = 'family-records';
    const list = document.getElementById('list');
    const hint = document.getElementById('hint');

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch { return []; }
    }
    function save(items) { localStorage.setItem(KEY, JSON.stringify(items)); }

    function render() {
      const items = load();
      list.innerHTML = '';
      hint.style.display = items.length ? 'none' : 'block';
      for (const item of items) {
        const box = document.createElement('div');
        box.className = 'record';
        const h = document.createElement('h3');
        h.textContent = item.title;
        const t = document.createElement('time');
        t.textContent = new Date(item.at).toLocaleString('zh-CN');
        const p = document.createElement('p');
        p.textContent = item.note || '';
        const del = document.createElement('button');
        del.textContent = '删除';
        del.addEventListener('click', () => remove(item.id));
        box.append(h, t, p, del);
        list.append(box);
      }
    }

    function add(title, note) {
      const items = load();
      items.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title, note, at: Date.now() });
      save(items);
      render();
    }

    function remove(id) {
      save(load().filter((i) => i.id !== id));
      render();
    }

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const note = document.getElementById('note').value.trim();
      if (!title) return;
      add(title, note);
      e.target.reset();
    });

    render();
  </script>
</body>
</html>
