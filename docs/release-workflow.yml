name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify clean tree at tag
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
            Write-Error "Tree is not clean at tag: $status"
            exit 1
          }
          Write-Host "Clean tree at $(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Harness pin
        run: npm run doctor

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build Windows NSIS installer
        run: npm run desktop:package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer artifact exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-desktop -Filter "Ming Workbench Setup *.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "NSIS installer artifact not found in dist-desktop"
            exit 1
          }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/Ming Workbench Setup *.exe
            dist-desktop/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
