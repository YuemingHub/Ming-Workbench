<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ming Workbench</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #ffffff 0, #f5f7fb 42%, #eef2f8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .welcome {
      width: min(620px, calc(100% - 40px));
      padding: 40px 0 56px;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #667085;
    }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 48px); line-height: 1.1; letter-spacing: -.04em; }
    .lede { margin: 18px auto 0; max-width: 500px; color: #596579; font-size: 16px; line-height: 1.65; }
    .primary {
      margin-top: 30px;
      border-radius: 14px;
      padding: 14px 26px;
      border: 1px solid transparent;
      background: #172033;
      color: white;
      font: 700 16px/1 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    .primary:hover { background: #26324d; }
    .primary:disabled { cursor: wait; opacity: .55; }
    .steps {
      margin: 34px auto 0;
      max-width: 460px;
      display: grid;
      gap: 10px;
      text-align: left;
      color: #43506a;
      font-size: 14px;
    }
    .step { display: flex; gap: 10px; align-items: baseline; }
    .step b { color: #172033; }
    .muted { margin-top: 26px; font-size: 13px; color: #8a94a8; }
  </style>
</head>
<body>
  <main class="welcome">
    <p class="eyebrow">MING WORKBENCH</p>
    <h1>先选择一个你想交给 Ming Workbench 的项目</h1>
    <p class="lede">Ming Workbench 会先只读理解这个项目，再和你确认每一步。它不会在你确认之前修改任何文件。</p>
    <button id="pick-project" class="primary" type="button">选择项目</button>
    <div class="steps" id="steps">
      <div class="step"><b>1</b><span>选择你要工作的项目</span></div>
      <div class="step"><b>2</b><span>配置 AI（模型和密钥只保存在本机）</span></div>
      <div class="step"><b>3</b><span>用普通话说你想做什么</span></div>
      <div class="step"><b>4</b><span>Workbench 先理解，再给你看准备做什么</span></div>
      <div class="step"><b>5</b><span>你确认后它才动手，最后给你证据</span></div>
    </div>
    <p class="muted">选择项目后，Workbench 需要花一点时间准备运行环境（只需要一次）。</p>
  </main>
  <script>
    const button = document.getElementById('pick-project')
    button.addEventListener('click', async () => {
      button.disabled = true
      try {
        const result = await window.mingWorkbench.selectProject()
        if (result && !result.canceled && result.url) {
          window.location.href = result.url
        }
      } catch {
        // Keep the button usable if the picker fails for any reason.
      } finally {
        button.disabled = false
      }
    })
  </script>
</body>
</html>
