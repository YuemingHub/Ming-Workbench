name: installed-own-key-human-first-journey

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/idea/**'
      - 'src/index.ts'
      - 'scripts/installed-own-key-journey-driver.mjs'
      - 'scripts/installed-own-key-human-first-journey.ps1'
      - 'scripts/provider-fixture-server.mjs'
      - 'package.json'
      - '.github/workflows/installed-own-key-human-first-journey.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/idea/**'
      - 'src/index.ts'
      - 'scripts/installed-own-key-journey-driver.mjs'
      - 'scripts/installed-own-key-human-first-journey.ps1'
      - 'scripts/provider-fixture-server.mjs'
      - 'package.json'
      - '.github/workflows/installed-own-key-human-first-journey.yml'

permissions:
  contents: read

jobs:
  installed-own-key-human-first-journey:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Ming Workbench
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run check
          npm test

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'node_modules/electron/dist/electron.exe')) {
            Write-Host 'electron binary missing; running install.js'
            node node_modules/electron/install.js
            if ($LASTEXITCODE -ne 0) { Write-Error "electron install.js failed (exit $LASTEXITCODE)" }
          }
          npm run desktop:package
          if ($LASTEXITCODE -ne 0) { Write-Error "desktop:package failed (exit $LASTEXITCODE)" }

      - name: Run Installed Own-Key Human-First Journey (Stage 2.5)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:RUNNER_TEMP 'own-key-artifacts'
          & pwsh -NoProfile -File scripts/installed-own-key-human-first-journey.ps1 -ArtifactDir $artifact
          if ($LASTEXITCODE -ne 0) {
            Write-Error "installed own-key human-first journey failed (exit $LASTEXITCODE)"
          }

      - name: Upload own-key journey artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: own-key-human-first-journey-logs
          path: |
            ${{ runner.temp }}/own-key-artifacts/**
          if-no-files-found: ignore