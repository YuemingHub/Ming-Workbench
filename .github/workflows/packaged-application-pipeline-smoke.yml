name: packaged-application-pipeline-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/start-local-web.mjs'
      - 'scripts/packaged-application-pipeline-smoke.ps1'
      - 'scripts/build-harness-capsule.mjs'
      - 'scripts/prepare-python-runtime.mjs'
      - 'src/web/**'
      - 'src/hosts/**'
      - 'src/projects/**'
      - 'src/transports/**'
      - 'src/persistence/**'
      - 'package.json'
      - '.workbench/vendor/**'
      - '.github/workflows/packaged-application-pipeline-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/start-local-web.mjs'
      - 'scripts/packaged-application-pipeline-smoke.ps1'
      - 'scripts/build-harness-capsule.mjs'
      - 'scripts/prepare-python-runtime.mjs'
      - 'src/web/**'
      - 'src/hosts/**'
      - 'src/projects/**'
      - 'src/transports/**'
      - 'src/persistence/**'
      - 'package.json'
      - '.workbench/vendor/**'
      - '.github/workflows/packaged-application-pipeline-smoke.yml'

permissions:
  contents: read

jobs:
  consumer-journey:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Ming Workbench
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run check
          npm test

      - name: Build NSIS installer (prepares bundled Python + Harness capsule + packages once)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'node_modules/electron/dist/electron.exe')) {
            Write-Host 'electron binary missing; running install.js'
            node node_modules/electron/install.js
            if ($LASTEXITCODE -ne 0) { Write-Error "electron install.js failed (exit $LASTEXITCODE)" }
          }
          npm run desktop:package
          if ($LASTEXITCODE -ne 0) { Write-Error "desktop:package failed (exit $LASTEXITCODE)" }

      - name: Run Packaged Application Pipeline Smoke (L2+, not L3)
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: fixture-key
          DEEPSEEK_BASE_URL: http://127.0.0.1:8000/v1
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:RUNNER_TEMP 'pipeline-smoke-artifacts'
          & pwsh -NoProfile -File scripts/packaged-application-pipeline-smoke.ps1 -SkipBuild -ArtifactDir $artifact
          if ($LASTEXITCODE -ne 0) {
            Write-Error "packaged application pipeline smoke failed (exit $LASTEXITCODE)"
          }

      - name: Upload pipeline smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-smoke-logs
          path: |
            ${{ runner.temp }}/pipeline-smoke-artifacts/**
            ${{ runner.temp }}/fixture.out.log
            ${{ runner.temp }}/fixture.err.log
            dist-desktop/builder-debug.yml
          if-no-files-found: ignore
