name: harness-acp-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'harness/**'
      - 'harness.lock.json'
      - 'src/transports/harness-acp.ts'
      - 'src/execution/provider-grant.ts'
      - 'scripts/smoke-harness-acp.mjs'
      - 'package.json'
      - '.github/workflows/harness-acp-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'harness/**'
      - 'harness.lock.json'
      - 'src/transports/harness-acp.ts'
      - 'src/execution/provider-grant.ts'
      - 'scripts/smoke-harness-acp.mjs'
      - 'package.json'
      - '.github/workflows/harness-acp-smoke.yml'

permissions:
  contents: read

jobs:
  upstream-acp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Ming Workbench
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package.json

      - name: Install Workbench dependencies
        run: npm install --no-audit --no-fund

      - name: Compile Workbench transport
        run: npm run build:test

      - name: Checkout exact reviewed DeepSeek Harness source
        shell: bash
        run: |
          set -euo pipefail
          HARNESS_SHA="$(node -p "JSON.parse(require('fs').readFileSync('harness.lock.json','utf8')).reviewedCommit")"
          HARNESS_REPO="$(node -p "JSON.parse(require('fs').readFileSync('harness.lock.json','utf8')).upstreamRepository")"
          mkdir .harness
          git -C .harness init
          git -C .harness remote add origin "$HARNESS_REPO"
          git -C .harness fetch --depth=1 origin "$HARNESS_SHA"
          git -C .harness checkout --detach FETCH_HEAD
          test "$(git -C .harness rev-parse HEAD)" = "$HARNESS_SHA"
          echo "MING_HARNESS_CHECKOUT=$GITHUB_WORKSPACE/.harness" >> "$GITHUB_ENV"

      - name: Install reviewed Harness workspace
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.7.0 --no-audit --no-fund
          pnpm --dir "$MING_HARNESS_CHECKOUT" install --frozen-lockfile

      - name: Verify exact Harness identity
        run: npm run doctor:harness

      - name: Run real ACP session through Harness with official mock LLM
        shell: bash
        env:
          DEEPSEEK_API_KEY: mock-key
          DEEPSEEK_BASE_URL: http://127.0.0.1:8000/v1
        run: |
          set -euo pipefail
          MOCK_LOG="$RUNNER_TEMP/ming-workbench-mock-llm.jsonl"
          MOCK_ERR="$RUNNER_TEMP/ming-workbench-mock-llm.stderr"

          pnpm --dir "$MING_HARNESS_CHECKOUT" run mock:llm -- \
            --port 8000 \
            --api-key mock-key \
            --sequence success \
            --success-text WORKBENCH_ACP_SMOKE_OK \
            >"$MOCK_LOG" 2>"$MOCK_ERR" &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 100); do
            if grep -q '"ready"' "$MOCK_LOG" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$MOCK_PID" 2>/dev/null; then
              cat "$MOCK_LOG" || true
              cat "$MOCK_ERR" >&2 || true
              exit 1
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'mock LLM did not become ready' >&2
            cat "$MOCK_LOG" || true
            cat "$MOCK_ERR" >&2 || true
            exit 1
          fi

          node scripts/smoke-harness-acp.mjs

          echo '--- mock LLM request log ---'
          cat "$MOCK_LOG"
