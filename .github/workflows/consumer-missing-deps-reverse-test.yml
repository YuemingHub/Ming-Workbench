name: consumer-missing-deps-reverse-test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/hosts/**'
      - 'src/projects/**'
      - 'src/transports/**'
      - 'src/web/**'
      - 'scripts/consumer-missing-deps-test.mjs'
      - 'scripts/build-harness-capsule.mjs'
      - 'scripts/prepare-python-runtime.mjs'
      - 'package.json'
      - '.github/workflows/consumer-missing-deps-reverse-test.yml'
  push:
    branches: [main]
    paths:
      - 'src/hosts/**'
      - 'src/projects/**'
      - 'src/transports/**'
      - 'src/web/**'
      - 'scripts/consumer-missing-deps-test.mjs'
      - 'scripts/build-harness-capsule.mjs'
      - 'scripts/prepare-python-runtime.mjs'
      - 'package.json'
      - '.github/workflows/consumer-missing-deps-reverse-test.yml'

permissions:
  contents: read

jobs:
  missing-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Ming Workbench
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install Workbench dependencies
        run: npm install --no-audit --no-fund

      - name: Compile Workbench
        run: npm run build:test

      - name: Prepare exact reviewed Harness and build prebuilt capsule
        shell: bash
        run: |
          set -euo pipefail
          npm run harness:prepare
          node scripts/build-harness-capsule.mjs

      - name: Prepare bundled Python runtime (POSIX venv simulation)
        run: npm run python:prepare

      - name: Run missing-dependency reverse test (consumer PATH)
        run: node scripts/consumer-missing-deps-test.mjs
