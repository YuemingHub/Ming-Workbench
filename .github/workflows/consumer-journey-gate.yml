name: consumer-journey-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/start-local-web.mjs'
      - 'scripts/consumer-journey-gate.ps1'
      - 'scripts/build-harness-capsule.mjs'
      - 'scripts/prepare-python-runtime.mjs'
      - 'src/web/**'
      - 'src/hosts/**'
      - 'src/projects/**'
      - 'src/transports/**'
      - 'src/persistence/**'
      - 'package.json'
      - '.workbench/vendor/**'
      - '.github/workflows/consumer-journey-gate.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/start-local-web.mjs'
      - 'scripts/consumer-journey-gate.ps1'
      - 'scripts/build-harness-capsule.mjs'
      - 'scripts/prepare-python-runtime.mjs'
      - 'src/web/**'
      - 'src/hosts/**'
      - 'src/projects/**'
      - 'src/transports/**'
      - 'src/persistence/**'
      - 'package.json'
      - '.workbench/vendor/**'
      - '.github/workflows/consumer-journey-gate.yml'

permissions:
  contents: read

jobs:
  consumer-journey:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Ming Workbench
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled Python runtime (pinned python.org embeddable)
        run: npm run python:prepare

      - name: Prepare exact reviewed Harness source and build prebuilt capsule
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run harness:prepare
          node scripts/build-harness-capsule.mjs
          if ($LASTEXITCODE -ne 0) { Write-Error "harness capsule build failed (exit $LASTEXITCODE)" }

      - name: Verify capsule identity and compiled runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run check
          npm test

      - name: Start repository-owned OpenAI-compatible provider fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $capsule = Join-Path $PWD '.workbench/vendor/deepseek-harness-capsule'
          $tsx = Join-Path $capsule 'node_modules/tsx/dist/cli.mjs'
          if (-not (Test-Path $tsx)) { Write-Error "tsx runner missing in capsule" }
          Start-Process -FilePath 'node' -ArgumentList @($tsx, '--tsconfig', (Join-Path $capsule 'tsconfig.json'), (Join-Path $capsule 'packages/test-support/llm-mock-server/src/bin.ts'), '--port', '8000', '--api-key', 'mock-key', '--sequence', 'success', '--success-text', 'CONSUMER_JOURNEY_OK', '--repeat-last') -WindowStyle Hidden -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'mock.out.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'mock.err.log')
          # Wait for the fixture to bind.
          $deadline = (Get-Date).AddSeconds(60)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path (Join-Path $env:RUNNER_TEMP 'mock.out.log')) {
              $content = Get-Content (Join-Path $env:RUNNER_TEMP 'mock.out.log') -Raw -ErrorAction SilentlyContinue
              if ($content -match '"ready"') { $ready = $true; break }
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { Write-Error 'provider fixture did not become ready' }
          "MING_MOCK_FIXTURE_READY=1" | Out-File $env:GITHUB_ENV -Append

      - name: Run Consumer Journey Gate (L3)
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: mock-key
          DEEPSEEK_BASE_URL: http://127.0.0.1:8000/v1
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:RUNNER_TEMP 'consumer-journey-artifacts'
          & pwsh -NoProfile -File scripts/consumer-journey-gate.ps1 -ArtifactDir $artifact
          if ($LASTEXITCODE -ne 0) {
            Write-Error "consumer journey gate failed (exit $LASTEXITCODE)"
          }

      - name: Upload consumer journey diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-journey-logs
          path: |
            ${{ runner.temp }}/consumer-journey-artifacts/**
            ${{ runner.temp }}/mock.out.log
            ${{ runner.temp }}/mock.err.log
            dist-desktop/builder-debug.yml
          if-no-files-found: ignore
