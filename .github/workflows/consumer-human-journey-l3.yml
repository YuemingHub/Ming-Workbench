name: consumer-human-journey-l3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/start-local-web.mjs'
      - 'scripts/ui-journey-driver.mjs'
      - 'scripts/consumer-human-journey-l3.ps1'
      - 'scripts/provider-fixture-server.mjs'
      - 'scripts/build-harness-capsule.mjs'
      - 'scripts/prepare-python-runtime.mjs'
      - 'src/web/**'
      - 'src/hosts/**'
      - 'src/projects/**'
      - 'src/transports/**'
      - 'src/execution/**'
      - 'src/persistence/**'
      - 'package.json'
      - '.workbench/vendor/**'
      - '.github/workflows/consumer-human-journey-l3.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/start-local-web.mjs'
      - 'scripts/ui-journey-driver.mjs'
      - 'scripts/consumer-human-journey-l3.ps1'
      - 'scripts/provider-fixture-server.mjs'
      - 'scripts/build-harness-capsule.mjs'
      - 'scripts/prepare-python-runtime.mjs'
      - 'src/web/**'
      - 'src/hosts/**'
      - 'src/projects/**'
      - 'src/transports/**'
      - 'src/execution/**'
      - 'src/persistence/**'
      - 'package.json'
      - '.workbench/vendor/**'
      - '.github/workflows/consumer-human-journey-l3.yml'

permissions:
  contents: read

jobs:
  human-journey-l3:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Ming Workbench
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run check
          npm test

      - name: Build NSIS installer (prepares bundled Python + Harness capsule + packages once)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run desktop:package
          if ($LASTEXITCODE -ne 0) { Write-Error "desktop:package failed (exit $LASTEXITCODE)" }

      - name: Start repository-owned OpenAI-compatible provider fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureTarget = Join-Path $env:RUNNER_TEMP 'l3-fixture-target'
          New-Item -ItemType Directory -Force -Path $fixtureTarget | Out-Null
          $env:FIXTURE_TARGET_DIR = $fixtureTarget
          $env:FIXTURE_PORT = '8000'
          $env:FIXTURE_API_KEY = 'fixture-key'
          Start-Process -FilePath 'node' -ArgumentList 'scripts/provider-fixture-server.mjs' -WindowStyle Hidden -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'fixture.out.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'fixture.err.log')
          $deadline = (Get-Date).AddSeconds(60)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path (Join-Path $env:RUNNER_TEMP 'fixture.out.log')) {
              $content = Get-Content (Join-Path $env:RUNNER_TEMP 'fixture.out.log') -Raw -ErrorAction SilentlyContinue
              if ($content -match 'provider-fixture ready') { $ready = $true; break }
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Write-Error 'provider fixture did not become ready'
          }
          "L3_FIXTURE_TARGET=$fixtureTarget" | Out-File $env:GITHUB_ENV -Append

      - name: Run Consumer Human Journey (TRUE L3)
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: fixture-key
          DEEPSEEK_BASE_URL: http://127.0.0.1:8000/v1
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:RUNNER_TEMP 'l3-artifacts'
          & pwsh -NoProfile -File scripts/consumer-human-journey-l3.ps1 -SkipBuild -ArtifactDir $artifact
          if ($LASTEXITCODE -ne 0) {
            Write-Error "consumer human journey L3 failed (exit $LASTEXITCODE)"
          }

      - name: Upload L3 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-human-journey-l3-logs
          path: |
            ${{ runner.temp }}/l3-artifacts/**
            ${{ runner.temp }}/fixture.out.log
            ${{ runner.temp }}/fixture.err.log
            dist-desktop/builder-debug.yml
          if-no-files-found: ignore
