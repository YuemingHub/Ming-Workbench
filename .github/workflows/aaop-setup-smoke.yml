name: aaop-setup-smoke-l1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/projects/aaop-setup.ts'
      - 'src/projects/onboarding.ts'
      - 'src/index.ts'
      - 'scripts/smoke-aaop-setup.mjs'
      - 'package.json'
      - '.github/workflows/aaop-setup-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'src/projects/aaop-setup.ts'
      - 'src/projects/onboarding.ts'
      - 'src/index.ts'
      - 'scripts/smoke-aaop-setup.mjs'
      - 'package.json'
      - '.github/workflows/aaop-setup-smoke.yml'

permissions:
  contents: read

jobs:
  promoted-stable-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Ming Workbench
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Setup AAOP-supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install Workbench dependencies
        run: npm install --no-audit --no-fund

      - name: Compile Workbench setup adapter
        run: npm run build:test

      - name: Install current promoted AAOP stable into an ephemeral project and verify canonical bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/smoke-aaop-setup.mjs
