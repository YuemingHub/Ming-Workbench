<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>猫咪提醒</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; line-height: 1.6; }
    h1 { font-size: 1.4rem; }
    form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    input, button { font: inherit; box-sizing: border-box; width: 100%; padding: 8px; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: 0; border-radius: 6px; }
    button:hover { background: #1d4ed8; }
    .item { border: 1px solid #8884; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
    .item h3 { margin: 0 0 4px; font-size: 1rem; }
    .item time { color: #888; font-size: 0.8rem; }
    .item.due { border-color: #b91c1c; }
    .item.due h3 { color: #b91c1c; }
    .item button { width: auto; background: #16a34a; padding: 2px 10px; font-size: 0.8rem; }
    .empty { color: #888; }
  </style>
</head>
<body>
  <h1>猫咪提醒</h1>
  <p class="empty" id="hint">把喂食、换水、疫苗记下来，到点打开看一眼。手机上就能用。</p>
  <form id="form">
    <input id="name" name="name" placeholder="事项，比如：喂食、换水、疫苗" maxlength="40" required />
    <input id="when" name="when" type="datetime-local" required />
    <button type="submit">添加提醒</button>
  </form>
  <div id="list"></div>
  <script>
    const KEY = 'cat-care-items'
    const items = JSON.parse(localStorage.getItem(KEY) ?? '[]')
    const form = document.getElementById('form')
    const list = document.getElementById('list')
    const hint = document.getElementById('hint')
    function render() {
      list.innerHTML = ''
      hint.hidden = items.length > 0
      const now = Date.now()
      for (let i = items.length - 1; i >= 0; i--) {
        const due = new Date(items[i].when).getTime() <= now && !items[i].done
        const el = document.createElement('div')
        el.className = 'item' + (due ? ' due' : '')
        el.innerHTML = `<h3>${escapeHtml(items[i].name)}</h3><time>${items[i].when.replace('T', ' ')}${items[i].done ? '，已完成' : due ? '，该做啦' : ''}</time>`
        const btn = document.createElement('button')
        btn.textContent = items[i].done ? '恢复' : '做完了'
        btn.onclick = () => { items[i].done = !items[i].done; save(); render() }
        el.appendChild(btn)
        list.appendChild(el)
      }
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(items)) }
    function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      items.push({ name: form.name.value.trim(), when: form.when.value, done: false })
      form.reset()
      save()
      render()
    })
    render()
  </script>
</body>
</html>
