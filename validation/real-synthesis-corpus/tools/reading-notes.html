<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>读书笔记</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; line-height: 1.6; }
    h1 { font-size: 1.4rem; }
    form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    input, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 8px; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: 0; border-radius: 6px; }
    button:hover { background: #1d4ed8; }
    .note { border: 1px solid #8884; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
    .note h3 { margin: 0 0 4px; font-size: 1rem; }
    .note time { color: #888; font-size: 0.8rem; }
    .note p { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
    .note button { width: auto; background: #b91c1c; padding: 2px 10px; font-size: 0.8rem; }
    .empty { color: #888; }
  </style>
</head>
<body>
  <h1>读书笔记</h1>
  <p class="empty" id="hint">看完书写一句感想，隔阵子再翻翻。没有打卡，也没有任务。</p>
  <form id="form">
    <input id="book" name="book" placeholder="书名" maxlength="80" required />
    <textarea id="thought" name="thought" placeholder="随手写两句感想"></textarea>
    <button type="submit">记下</button>
  </form>
  <div id="list"></div>
  <script>
    const KEY = 'reading-notes-items'
    const items = JSON.parse(localStorage.getItem(KEY) ?? '[]')
    const form = document.getElementById('form')
    const list = document.getElementById('list')
    const hint = document.getElementById('hint')
    function render() {
      list.innerHTML = ''
      hint.hidden = items.length > 0
      for (let i = items.length - 1; i >= 0; i--) {
        const el = document.createElement('div')
        el.className = 'note'
        el.innerHTML = `<h3>${escapeHtml(items[i].book)}</h3><time>${items[i].at}</time><p>${escapeHtml(items[i].thought)}</p>`
        const del = document.createElement('button')
        del.textContent = '删除'
        del.onclick = () => { items.splice(i, 1); save(); render() }
        el.appendChild(del)
        list.appendChild(el)
      }
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(items)) }
    function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      items.push({ book: form.book.value.trim(), thought: form.thought.value.trim(), at: new Date().toLocaleString('zh-CN') })
      form.reset()
      save()
      render()
    })
    render()
  </script>
</body>
</html>
