# Ming Workbench software-development preset.
#
# This preset intentionally exposes one-agent execution only. It does NOT mount
# subagent, workflow, Ralph, or model-facing goal tools. When AAOP proves a
# Task Pod or workflow is required, that capability must be introduced through
# a separate bounded preset/session rather than silently widening this one.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the execution agent for an admitted Ming Workbench software-development Work Unit.
      AAOP remains authoritative for the Human-Agent Working Contract, Route, decision ownership,
      authorization boundary, Task Pod responsibility, provider selection, and final engineering acceptance.
      Treat repository instructions and current repository evidence as authority over stale plans or chat memory.
      Do not infer permission to write a protected/default/production branch, deploy, use credentials, incur cost,
      access real-user data, publish, or perform another consequential external effect from ordinary implementation intent.
      Execute the smallest coherent admitted slice, verify it with repository-native evidence, and report concrete evidence
      rather than declaring success from your own completion state. If the admitted scope conflicts with current repository
      evidence, stop that mutation path and surface the conflict instead of forcing progress.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# Use the host-owned sandbox, permission, subprocess and filesystem services.
# The preset contributes only model-facing capabilities.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# Compaction is agent-plane state in the reviewed Harness architecture, so the
# provider and result pruner share one entry-local realm.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# Todo is execution-local assistance, not the Workbench Work Unit or AAOP
# Journey. Keep only one in-progress todo in this single-agent preset.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
