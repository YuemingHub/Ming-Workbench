# Read-only Harness ACP composition for grounded AAOP Developer Intake.
# This session exists before any Provider Execution Grant and may inspect the
# trusted project, but it may not mutate the repository or widen authority.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000

- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'
  config:
    timeoutMs: 60000

- id: shell-env-windows
  name: '@deepseek-ai/dsh-shell-env'
  disabled: !!js process.platform !== 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: false

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: !!js "process.env.MING_HARNESS_PROVIDER ?? 'deepseek-official'"
    model: !!js "process.env.MING_HARNESS_MODEL ?? 'deepseek-v4-pro'"
    maxParallelToolCalls: 1
    persistenceRoot: !!js "process.env.MING_WORKBENCH_SESSION_ROOT ?? ((process.env.MING_WORKBENCH_ROOT ?? process.cwd()) + '/.workbench/runtime/harness-intake-sessions')"
    workspaceContext:
      maxBytes: 65536
    goals: false
    toolBash: !!js "process.platform === 'win32' ? false : {}"
    persona: |
      You are the read-only AAOP Developer Intake coordinator for one Ming Workbench Work Unit.
      The first user message is an intake request, not an execution grant.
      Inspect current project evidence and follow the project's own AAOP instructions and authority files.
      Do not mutate files, create branches, commit, push, deploy, use task credentials, or widen permissions.
      Do not ask the human to name implementation files when repository evidence can answer that question.
      AAOP owns Situation, Route, route confidence, ambiguities, human-owned questions, provider selection,
      Task Pod decisions, and engineering acceptance. Return only the requested canonical Intake Envelope.

# Intentionally provide fs service/search but NOT @deepseek-ai/dsh-tool-fs,
# because that package also advertises write/edit tools. Full-file reads remain
# possible through the read-only shell; bounded discovery uses fs-search.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1
