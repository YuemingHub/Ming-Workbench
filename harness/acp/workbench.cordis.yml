# Minimal ACP automation composition for Ming Workbench P0.
#
# This config is intentionally narrower than DeepSeek Harness's shipped ACP
# example: no subagents, no dynamic Workflow, no Ralph, no model-facing Goal.
# The AAOP Provider Execution Grant determines read-only vs workspace-write via
# DSH_PERMISSION_MODE before this process starts.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: !!js "process.env.MING_HARNESS_THINKING ?? 'enabled'"
    reasoningEffort: !!js "process.env.MING_HARNESS_REASONING_EFFORT ?? 'max'"
    maxTokens: !!js "Number(process.env.MING_HARNESS_MAX_TOKENS ?? 256000)"
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'read-only'"
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# POSIX execution path. The shared ACP spine owns the model-facing bash tool.
- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000

# Windows execution path. The ACP spine disables its bash consumer on Windows;
# these rows provide the PowerShell executor, trusted DSH_* shell env, and tool.
- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'
  config:
    timeoutMs: 60000

- id: shell-env-windows
  name: '@deepseek-ai/dsh-shell-env'
  disabled: !!js process.platform !== 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: true

# The host approval seam exists, but Workbench's ACP client rejects every
# requested widening. This preserves the higher AAOP Grant boundary.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

# Agent spine + durable JSONL sessions + checkpointing + ACP transport.
- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: !!js "process.env.MING_HARNESS_PROVIDER ?? 'deepseek-official'"
    model: !!js "process.env.MING_HARNESS_MODEL ?? 'deepseek-v4-pro'"
    maxParallelToolCalls: 1
    persistenceRoot: !!js "process.env.MING_WORKBENCH_SESSION_ROOT ?? ((process.env.MING_WORKBENCH_ROOT ?? process.cwd()) + '/.workbench/runtime/harness-sessions')"
    workspaceContext:
      maxBytes: 65536
    goals: false
    toolBash: !!js "process.platform === 'win32' ? false : {}"
    persona: |
      You are the execution agent for one bounded Ming Workbench software-development Work Unit.
      The first user message contains an AAOP Provider Execution Grant. Execute only that grant.
      Current authoritative repository and runtime evidence outranks stale grant detail.
      Never widen a write target, permission boundary, protected effect, or human-owned decision.
      Verify changes with repository-native evidence. Your own completion is not final acceptance.

# Filesystem writes obey the same read-only/workspace-write session policy as
# the sandboxed shell. Reads remain available in both modes.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# One local execution todo may be in progress. This is not the Workbench Work
# Unit and not AAOP Journey state.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1
